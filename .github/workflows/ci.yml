# Nova CI — the mergeable=green gate for every PR.
# Runs typecheck (server + shared + desktop via root tsc -b), lint, tests, and —
# once supabase/ exists — a shadow migration replay.
# See docs/LOOP_PLAYBOOK.md Phase 0.
name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root typecheck runs `tsc -b` over every referenced project (packages/shared,
      # apps/server, apps/desktop) and then the noEmit pass that also covers the
      # test files. apps/mobile is frozen and out of all of it (apps/mobile/FROZEN.md).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The Supabase stack must come up BEFORE the tests so the integration
      # suite runs against real Postgres — it is a permanent gate, not an
      # optional skip. These steps stay dormant until supabase/config.toml
      # exists, then activate automatically (guard kept so Test still passes if
      # supabase/ is ever absent).
      - name: Detect Supabase project
        id: supabase
        run: |
          if [ -f supabase/config.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/config.toml yet — skipping local stack + integration tests."
          fi

      - name: Install Supabase CLI
        if: steps.supabase.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: "2.109.1"

      # `supabase start` boots the full local stack AND replays every migration
      # (the shadow-migration check), then we surface its URL + service-role key
      # to the Test step so smoke.integration.test.ts executes instead of skipping.
      - name: Start Supabase stack
        if: steps.supabase.outputs.present == 'true'
        run: supabase start

      - name: Export Supabase env
        if: steps.supabase.outputs.present == 'true'
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Test
        run: npm run test
